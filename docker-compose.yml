# SAC Quest con Docker (guia: docs/docker.md)
#
#   cp server/.env.example server/.env    # APP_DOMAIN, APP_SECRET y TUNNEL_TOKEN
#   docker compose up -d --build                     # solo la app
#   docker compose --profile tunnel up -d --build    # app + Cloudflare Tunnel
#
# Opcional, como variables al lanzar (o en el .env de la raiz):
#   SAC_DATA_DIR=/mnt/ssd/sac-quest   datos en una carpeta del host (SSD) en vez del volumen
#   SAC_BACKUP_DIR=/media/usb/backup  destino de `npm run backup` (por defecto ./backups)
#   SAC_BIND=0.0.0.0                  abre el puerto 8787 a la red local

# Nombre fijo: el volumen se llama sac-quest_sac-data sin importar la carpeta
name: sac-quest

services:
  app:
    build: .
    image: sac-quest:latest
    restart: unless-stopped
    # APP_DOMAIN, APP_SECRET, MAX_PHOTO_MB...
    env_file: server/.env
    # Fijos dentro del contenedor: pisan lo que diga server/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      STATIC_DIR: /app/dist
    # Solo en localhost: a internet se llega por el tunel (contenedor cloudflared).
    # SAC_BIND=0.0.0.0 la abre a la red local (probar por http://<ip-de-la-pi>:8787).
    ports:
      - "${SAC_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ${SAC_DATA_DIR:-sac-data}:/data
      - ${SAC_BACKUP_DIR:-./backups}:/backups
    logging:
      driver: local
      options:
        max-size: 10m

  # Cloudflare Tunnel con token (se crea en el panel de Cloudflare, ver
  # docs/docker.md). Solo arranca con --profile tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # Lee TUNNEL_TOKEN de server/.env (toda la config del servidor en un lugar)
    env_file: server/.env
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m

volumes:
  sac-data:
